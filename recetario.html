<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Maestro Lunavia & Usagi 🌙🐰</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdfbff; padding: 10px; color: #333; }
        .contenedor { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4b0082; margin-bottom: 20px; }
        .seccion { background: #f3e5f5; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #e1bee7; }
        .selector-material { background: #4b0082; padding: 15px; border-radius: 15px; color: white; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 12px; display: block; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        .btn { padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; }
        .btn-save { background: #4caf50; width: 100%; margin-top: 10px; }
        .btn-calc-lote { background: #ff9800; padding: 5px 10px; font-size: 12px; }
        .btn-enviar-calc { background: #9c27b0; padding: 8px 12px; font-size: 12px; margin-top: 8px; width: 100%; }
        .resultado-box { background: #fff; padding: 15px; border-radius: 12px; margin-top: 10px; border: 2px dashed #9c27b0; }
        .receta-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 12px; margin-top: 10px; border-left: 5px solid #9c27b0; }
        .badge-desglose { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 12px; border: 1px solid #eee; line-height: 1.6; }
        .calculo-lote { background: #fff8e1; border: 1px solid #ffe0b2; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 12px; display: none; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>✨ Recetario Producción</h2>

    <div class="selector-material">
        <label style="color: white;">💎 Material a trabajar:</label>
        <select id="tipoMaterial" onchange="limpiarYCalcular()">
            <option value="vela">🕯️ Vela (Cera + Estearina + Esencia)</option>
            <option value="yeso">🗿 Yeso (Yeso + Agua + Resistol)</option>
            <option value="resina">💧 Resina (Comp. A + Comp. B)</option>
        </select>
    </div>

    <!-- CÁLCULO POR MOLDE -->
    <div class="seccion" style="background: #e1f5fe; border-color: #b3e5fc;">
        <h4>💧 1. Cálculo por Molde</h4>
        <div style="display: flex; gap: 5px;">
            <div style="flex:1;"><label>Molde con agua (g):</label><input type="number" id="moldeAgua" placeholder="0" oninput="calcularPorAgua()"></div>
            <div style="flex:1;"><label>Molde vacío (g):</label><input type="number" id="moldeVacio" placeholder="0" oninput="calcularPorAgua()"></div>
        </div>
    </div>

    <!-- CALCULADORA DE MEZCLA -->
    <div class="seccion">
        <h4>🧪 2. Desglose de Mezcla</h4>
        <label>Peso total por pieza (g):</label>
        <input type="number" id="pesoTotal" placeholder="Ej. 200" oninput="calcularMezcla()">
        <div class="resultado-box" id="resultadoCalculo">Esperando datos...</div>
    </div>

    <!-- GUARDAR RECETA -->
    <div class="seccion" style="background: #e8f5e9; border-color: #c8e6c9;">
        <h4>📝 3. Guardar en Bitácora</h4>
        <input type="text" id="nombreReceta" placeholder="Nombre de la pieza">
        <input type="text" id="notas" placeholder="Aroma, color o marca">
        <button class="btn btn-save" onclick="guardarReceta()">💾 Guardar Receta</button>
    </div>

    <div id="listaRecetas"></div>
    <div style="text-align:center; margin-top:20px;"><a href="index.html" style="color:#9c27b0; text-decoration:none; font-weight:bold; font-size:13px;">⬅ Menú Principal</a></div>
</div>

<script>
    let recetas = JSON.parse(localStorage.getItem('recetas_final_v5')) || [];
    let valoresActuales = {};

    function limpiarYCalcular() { document.getElementById('pesoTotal').value = ""; calcularMezcla(); }

    function calcularPorAgua() {
        const agua = parseFloat(document.getElementById('moldeAgua').value) || 0;
        const vacio = parseFloat(document.getElementById('moldeVacio').value) || 0;
        const mat = document.getElementById('tipoMaterial').value;
        const neto = agua - vacio;
        if (neto > 0) {
            let factor = (mat === 'vela') ? 0.90 : (mat === 'yeso' ? 1.50 : 1.10);
            document.getElementById('pesoTotal').value = (neto * factor).toFixed(1);
            calcularMezcla();
        }
    }

    function calcularMezcla() {
        const total = parseFloat(document.getElementById('pesoTotal').value) || 0;
        const mat = document.getElementById('tipoMaterial').value;
        const resBox = document.getElementById('resultadoCalculo');
        
        if (total <= 0) { resBox.innerText = "Ingresa un peso..."; return; }

        if (mat === 'vela') {
            const e = total * 0.10; const b = total - e; const es = b * 0.10; const c = b - es; const o = b * 0.01;
            valoresActuales = { cera: c, estearina: es, esencia: e, olimpia: o };
            resBox.innerHTML = `• Cera: ${c.toFixed(1)}g<br>• Estearina: ${es.toFixed(1)}g<br>• Esencia: ${e.toFixed(1)}g<br><span style="color:#7b1fa2; font-weight:bold;">✨ Aditivo Olimpia: ${o.toFixed(1)}g</span>`;
        } else if (mat === 'yeso') {
            const a = total * 0.30; const r = total * 0.05; const y = total - a - r;
            valoresActuales = { yeso: y, agua: a, resistol: r };
            resBox.innerHTML = `• Yeso: ${y.toFixed(1)}g<br>• Agua: ${a.toFixed(1)}g<br>• Resistol: ${r.toFixed(1)}g`;
        } else {
            valoresActuales = { compA: total * 0.60, compB: total * 0.40 };
            resBox.innerHTML = `• Comp. A: ${valoresActuales.compA.toFixed(1)}g<br>• Comp. B: ${valoresActuales.compB.toFixed(1)}g`;
        }
    }

    function guardarReceta() {
        const nombre = document.getElementById('nombreReceta').value;
        if (!nombre) return alert("Ponle nombre");
        recetas.push({ nombre, mat: document.getElementById('tipoMaterial').value, notas: document.getElementById('notas').value, peso: document.getElementById('pesoTotal').value, valores: valoresActuales });
        localStorage.setItem('recetas_final_v5', JSON.stringify(recetas));
        dibujarRecetas();
    }

    function enviarACalculadora(i) {
        const r = recetas[i];
        localStorage.setItem('receta_transferida', JSON.stringify(r));
        alert(`✨ ${r.nombre} enviada a la Calculadora. ¡Abriendo calculadora!`);
        window.location.href = "calculadora.html";
    }

    function dibujarRecetas() {
        const lista = document.getElementById('listaRecetas');
        lista.innerHTML = "<h3>📚 Mis Piezas Guardadas</h3>";
        recetas.forEach((r, i) => {
            let htmlValores = "";
            for (const key in r.valores) htmlValores += `• ${key.charAt(0).toUpperCase() + key.slice(1)}: ${r.valores[key].toFixed(1)}g<br>`;
            
            lista.innerHTML += `
                <div class="receta-card">
                    <strong>${r.nombre}</strong> (${r.mat})<br>
                    <div class="badge-desglose"><strong>Peso pieza: ${r.peso}g</strong><br>${htmlValores}</div>
                    
                    <button class="btn btn-enviar-calc" onclick="enviarACalculadora(${i})">💰 Enviar a Calculadora</button>

                    <div style="margin-top:10px;">
                        <input type="number" id="n-${i}" placeholder="¿Cuántas piezas?" style="width:40%; padding:5px;">
                        <button class="btn btn-calc-lote" onclick="calcularLote(${i})">Calcular Lote</button>
                    </div>
                    <div id="resultado-lote-${i}" class="calculo-lote"></div>
                    <button onclick="borrar(${i})" style="color:red; background:none; border:none; margin-top:10px; cursor:pointer; font-size:10px;">Eliminar Receta</button>
                </div>`;
        });
    }

    function calcularLote(i) {
        const n = parseFloat(document.getElementById(`n-${i}`).value);
        if (!n || n <= 0) return alert("Pon cantidad válida");
        const r = recetas[i];
        let totalHtml = `<strong>Total para ${n} piezas:</strong><br>`;
        for (const key in r.valores) totalHtml += `• ${key}: ${(r.valores[key] * n).toFixed(1)}g<br>`;
        const div = document.getElementById(`resultado-lote-${i}`);
        div.innerHTML = totalHtml;
        div.style.display = "block";
    }

    function borrar(i) { if(confirm("¿Borrar?")) { recetas.splice(i, 1); localStorage.setItem('recetas_final_v5', JSON.stringify(recetas)); dibujarRecetas(); } }
    window.onload = dibujarRecetas;
</script>
</body>
</html>
